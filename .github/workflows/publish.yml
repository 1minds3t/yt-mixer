name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # IMPORTANT: Required for OIDC

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yt_mixer
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      
      - name: Build package
        run: python -m build
      
      # 1. Try OIDC (Trusted Publishing)
      - name: Publish to PyPI (OIDC)
        id: oidc_publish
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true  # If this fails, we move to the next step

      # 2. Try Token (Fallback)
      # We removed the 'secrets' check from the 'if' condition to fix the error.
      # If the secret is empty, this step will simply fail, triggering step 3.
      - name: Publish to PyPI (Token Fallback)
        id: token_publish
        if: steps.oidc_publish.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      # 3. Manual Instructions (If both failed)
      - name: Failure Notification & Manual Instructions
        if: steps.oidc_publish.outcome == 'failure' && steps.token_publish.outcome == 'failure'
        run: |
          echo "::error::❌ Automated publishing failed."
          echo "---------------------------------------------------"
          echo "1. OIDC (Trusted Publishing) failed."
          echo "2. API Token fallback failed (Token missing or invalid)."
          echo "---------------------------------------------------"
          echo "To publish manually, run:"
          echo "python -m pip install twine"
          echo "python -m twine upload dist/*"
          exit 1
